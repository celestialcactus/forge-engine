name: Cross-platform conformance

on:
  push:
    branches:
      - 'develop'
      - 'rebuild/master'
  pull_request:
    branches:
      - 'develop'
      - 'rebuild/master'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    name: Node 22 / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: ubuntu-latest
            target: ubuntu-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Record hosted target
        run: node -e "console.log('runner.os=' + process.env.RUNNER_OS + ' runner.arch=' + process.env.RUNNER_ARCH)"

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check
