name: Hybrid kernel conformance

on:
  push:
    branches:
      - 'develop'
      - 'rebuild/master'
  pull_request:
    branches:
      - 'develop'
      - 'rebuild/master'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked Rust dependencies
        run: cargo audit --deny warnings

  hybrid:
    name: Rust kernel + TypeScript adapter / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            binary-suffix: .exe
          - os: macos-15
            target: macos-arm64
            binary-suffix: ''
          - os: macos-15-intel
            target: macos-x64
            binary-suffix: ''
          - os: ubuntu-latest
            target: ubuntu-x64
            binary-suffix: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Record hosted target
        run: node -e "console.log('runner.os=' + process.env.RUNNER_OS + ' runner.arch=' + process.env.RUNNER_ARCH)"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt

      - name: Install locked Node dependencies
        run: npm ci

      - name: Format, lint, test, and build Rust
        run: |
          npm run rust:fmt
          npm run rust:lint
          npm run rust:test
          npm run rust:build

      - name: Preserve accepted TypeScript behavior
        run: npm run check

      - name: Exercise differential and MCP hybrid contract
        env:
          FORGE_KERNEL_BINARY: ${{ github.workspace }}/target/debug/forge-kernel${{ matrix.binary-suffix }}
        run: npm run test:hybrid

      - name: Exercise product CLI with automatic kernel discovery
        run: npm run smoke

      - name: Build optimized kernel
        run: npm run rust:build:release

      - name: Prove clean-install native package discovery
        run: npm run package:smoke:prepared

      - name: Build host-native npm package
        run: npm run package:native:pack

      - name: Retain optimized kernel for exact-host validation
        uses: actions/upload-artifact@v7
        with:
          name: forge-kernel-${{ runner.os }}-${{ runner.arch }}
          path: target/release/forge-kernel${{ matrix.binary-suffix }}
          if-no-files-found: error
          retention-days: 7

      - name: Retain host-native npm package
        uses: actions/upload-artifact@v7
        with:
          name: forge-native-package-${{ runner.os }}-${{ runner.arch }}
          path: target/native-package-archives/*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Enforce process-bridge latency ceiling
        env:
          FORGE_KERNEL_BINARY: ${{ github.workspace }}/target/release/forge-kernel${{ matrix.binary-suffix }}
          FORGE_BENCHMARK_SAMPLES: '20'
        run: npm run benchmark:hybrid -- --assert
